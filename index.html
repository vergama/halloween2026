<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollow Hill: a Halloween calendar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%83%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --night:#120a22; --plum:#2b1840; --bone:#ece2cc; --candle:#f6c768; --pumpkin:#e8731c; --moss:#86a37e; --dim:#a898b8;
  --serif:'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse 120% 70% at 50% -10%, #2c1945 0%, #160c29 45%, #0b0716 100%) fixed #0b0716;
  color:var(--bone); font-family:var(--serif); font-size:18px; line-height:1.5;
  padding:max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
header{max-width:1400px;margin:0 auto 18px;text-align:center}
h1{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;font-weight:400;font-size:clamp(2.6rem, 7vw, 5.2rem);line-height:1;margin:6px 0 8px;letter-spacing:.01em;
   color:var(--bone);text-shadow:0 0 28px rgba(246,199,104,.18), 0 2px 0 rgba(0,0,0,.6)}
h1.holding{transition:color 2s linear, text-shadow 2s linear;color:#ffd9a0;text-shadow:0 0 44px rgba(255,140,50,.95), 0 2px 0 rgba(0,0,0,.6)}
.status a{color:var(--bone);text-decoration-thickness:1px;text-underline-offset:3px}
.sub{font-style:italic;color:var(--dim);margin:0 auto;max-width:36em;font-size:1.05rem}
.status{margin:10px auto 0;color:var(--candle);font-size:1.08rem;max-width:40em;min-height:1.5em}
.stage{max-width:1400px;margin:0 auto}
.scroller{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:16px;scrollbar-width:thin}
.scene{position:relative;width:100%;min-width:760px;aspect-ratio:16/10;container-type:inline-size;border-radius:16px;overflow:hidden;
  background:#05030d;box-shadow:0 0 0 1px #2c1d3d, 0 40px 90px -40px #000;opacity:0;transition:opacity 1.2s ease}
.loaded .scene{opacity:1}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene>svg.front{pointer-events:none;z-index:5}
.hint{text-align:center;color:var(--dim);font-style:italic;margin:14px auto 0;font-size:1rem}
.swipe{display:none}
@media (max-width:800px){ .swipe{display:inline} }

/* ---------- doors ---------- */
.door{position:absolute;padding:0;margin:0;border:0;background:none;cursor:pointer;perspective:14cqw;font:inherit;color:inherit;
  -webkit-tap-highlight-color:transparent;z-index:2}
.door:focus-visible{outline:2px solid var(--candle);outline-offset:.5cqw;border-radius:.5cqw}
.door.locked{cursor:default}
.inside{position:absolute;inset:0;overflow:hidden;background:#05030a;opacity:0;transition:opacity .7s .35s, filter .3s}
.inside svg{width:100%;height:100%;display:block}
.inside::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none}
.open .inside{opacity:1}
.open:hover .inside{filter:brightness(1.18) saturate(1.1)}
.num{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;line-height:1;transition:opacity .35s;z-index:3}
.open .num{opacity:0}
.instant, .instant *{transition:none !important}

/* windows and the front door: two shutters */
.shape-arch .inside{border-radius:50% 50% 3px 3px / 32% 32% 3px 3px}
.shape-rect .inside{border-radius:3px}
.shape-round .inside{border-radius:50%}
.leaf{position:absolute;top:0;bottom:0;width:50%;transition:transform 1.2s cubic-bezier(.3,1.3,.45,1);
  background:repeating-linear-gradient(90deg,#4f3828 0 30%,#2b1c13 30% 33.4%);
  box-shadow:inset 0 0 0 1px #1a110b, inset 0 0 .7cqw rgba(0,0,0,.55)}
.leaf.l{left:0;transform-origin:0 50%}
.leaf.r{right:0;transform-origin:100% 50%}
.shape-arch .leaf.l{border-top-left-radius:100% 32%}
.shape-arch .leaf.r{border-top-right-radius:100% 32%}
.shape-round .leaf.l{border-radius:100% 0 0 100% / 50% 0 0 50%}
.shape-round .leaf.r{border-radius:0 100% 100% 0 / 0 50% 50% 0}
.shape-rect .leaf{border-radius:2px}
.kind-win .num{font-size:1.5cqw;color:#f0e2c2;text-shadow:0 .1cqw .25cqw #000}
.kind-win.open .leaf.l{transform:rotateY(-114deg)}
.kind-win.open .leaf.r{transform:rotateY(114deg)}
.kind-win.open .inside::after{box-shadow:inset 0 0 0 .18cqw #2a1b12}
.kind-win.open .inside{box-shadow:0 0 1.4cqw .3cqw rgba(255,190,100,.55)}
.kind-door .leaf{background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 30%), #521a24;
  box-shadow:inset 0 0 0 .22cqw #2c0c12, inset 0 0 0 .5cqw #521a24, inset 0 0 0 .62cqw #3a1018, inset 0 0 1.4cqw rgba(0,0,0,.55)}
.kind-door .leaf.l::after{content:'';position:absolute;right:10%;top:64%;width:.9cqw;height:.9cqw;border-radius:50%;border:.18cqw solid #c9a24a}
.kind-door .num{font-size:2.5cqw;color:#f1d39a;padding-bottom:18%;text-shadow:0 .1cqw .3cqw #000}
.kind-door.open .leaf.l{transform:rotateY(84deg)}
.kind-door.open .leaf.r{transform:rotateY(-84deg)}
.kind-door.open .inside{box-shadow:0 0 2.6cqw .6cqw rgba(255,190,100,.6)}

/* graves: the slab sinks into the earth */
.kind-tomb{overflow:hidden}
.kind-tomb .inside{opacity:1}
.slab{position:absolute;inset:0;transition:transform 1.4s cubic-bezier(.55,0,.8,.35);
  background:
    radial-gradient(circle at 22% 86%, rgba(96,128,72,.6) 0 7%, transparent 8%),
    radial-gradient(circle at 74% 92%, rgba(96,128,72,.5) 0 5%, transparent 6%),
    radial-gradient(circle at 60% 18%, rgba(255,255,255,.06) 0 14%, transparent 15%),
    linear-gradient(165deg,#9b97a8,#6b6779 55%,#4a4657);
  box-shadow:inset .35cqw .35cqw .45cqw rgba(255,255,255,.16), inset -.45cqw -.45cqw .7cqw rgba(0,0,0,.45)}
.kind-tomb.open .slab{transform:translateY(103%)}
.kind-tomb.opening{animation:tremble .55s ease-in-out}
.kind-tomb.opening .slab{transition-delay:.45s}
.kind-tomb .num{font-size:2.3cqw;color:#2e2b37;text-shadow:0 .1cqw 0 rgba(255,255,255,.28)}
.kind-tomb.open .inside::after{box-shadow:inset 0 0 1.6cqw .3cqw rgba(150,255,175,.45), inset 0 0 0 .3cqw #3d3a48}
.kind-tomb.shape-round, .kind-tomb.shape-round .inside, .kind-tomb.shape-round .slab{border-radius:50% 50% 4px 4px / 40% 40% 4px 4px}
.kind-tomb.shape-square, .kind-tomb.shape-square .inside, .kind-tomb.shape-square .slab{border-radius:18% 18% 4px 4px / 13% 13% 4px 4px}
.kind-tomb.shape-gothic{clip-path:polygon(0 24%,50% 0,100% 24%,100% 100%,0 100%);border-radius:0}
.kind-tomb.shape-gothic .num{padding-top:16%}
@keyframes tremble{0%,100%{transform:translate(0,0)}20%{transform:translate(-.25cqw,0) rotate(-1deg)}40%{transform:translate(.25cqw,0) rotate(1deg)}60%{transform:translate(-.18cqw,0)}80%{transform:translate(.12cqw,0)}}

/* pumpkins: roll away */
.pcover{position:absolute;inset:0;transform-origin:50% 88%;transition:transform 1.3s cubic-bezier(.45,0,.55,1), opacity .8s .55s;z-index:2}
.pcover svg{width:100%;height:100%;display:block;filter:drop-shadow(0 .3cqw .3cqw rgba(0,0,0,.5))}
.kind-pumpkin .inside{inset:10% 12% 6%;border-radius:50%}
.kind-pumpkin .num{font-size:2cqw;color:#5a2206;padding-top:14%;text-shadow:0 .08cqw 0 rgba(255,190,120,.45)}
.kind-pumpkin.open .pcover{transform:translateX(90%) rotate(100deg);opacity:0}
.kind-pumpkin.roll-left.open .pcover{transform:translateX(-90%) rotate(-100deg)}
.kind-pumpkin.open .inside::after{box-shadow:inset 0 0 0 .3cqw #e97a26, inset 0 0 1.4cqw rgba(255,150,40,.7)}
.kind-pumpkin.open .inside{box-shadow:0 0 1.6cqw .2cqw rgba(255,140,40,.5)}

/* a burst of light as something opens */
.door::before{content:'';position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;border-radius:50%;pointer-events:none;opacity:0;z-index:4;
  transform:translate(-50%,-50%) scale(.2);background:radial-gradient(circle, rgba(255,214,140,.8), rgba(255,214,140,0) 60%)}
.kind-pumpkin::before{background:radial-gradient(circle, rgba(255,150,50,.8), rgba(255,150,50,0) 60%)}
.door.burst::before{animation:burst 1.5s ease-out .35s}
.kind-tomb.burst::before{display:none}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.door.nope{animation:nope .4s}
@keyframes nope{25%{transform:translateX(-.35cqw)}50%{transform:translateX(.35cqw)}75%{transform:translateX(-.2cqw)}}

/* ---------- ambient scene motion ---------- */
.tw{animation:tw 3.5s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.15}}
.batfly{animation:batfly linear infinite}
@keyframes batfly{from{transform:translateX(-140px)}to{transform:translateX(1740px)}}
.bob{animation:bob 2.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(26px)}}
.flap{animation:flap .28s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes flap{to{transform:scaleY(.3)}}
.cloud{animation:cloud linear infinite alternate}
@keyframes cloud{from{transform:translateX(-260px)}to{transform:translateX(260px)}}
.ghostf{animation:ghostf 5s ease-in-out infinite alternate}
@keyframes ghostf{from{transform:translateY(0);opacity:.35}to{transform:translateY(-22px);opacity:.8}}
.fogd{animation:fogd 46s ease-in-out infinite alternate}
@keyframes fogd{from{transform:translateX(-90px)}to{transform:translateX(90px)}}
.flk{animation:flk 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flk{0%{opacity:1;transform:scale(1,1)}40%{opacity:.85;transform:scale(.96,1.04)}100%{opacity:.95;transform:scale(1.02,.97)}}
.blk{animation:blk 6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blk{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}

/* ---------- close-up view ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(6,3,12,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .3s}
.sheet{position:relative;margin:0;width:min(940px,100%);max-height:calc(100vh - 40px);overflow:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);
  background:linear-gradient(160deg,#25163a,#170e27);border:1px solid #3d2a55;border-radius:18px;box-shadow:0 40px 100px -20px #000;
  opacity:0;transform:translateY(16px) scale(.97);transition:opacity .35s, transform .45s cubic-bezier(.2,1.2,.4,1)}
.modal.show .backdrop{opacity:1}
.modal.show .sheet{opacity:1;transform:none}
.art{aspect-ratio:1;background:#000;border-radius:17px 0 0 17px;overflow:hidden}
.art svg{width:100%;height:100%;display:block}
.cap{padding:34px 32px 24px;display:flex;flex-direction:column}
.m-date{margin:0 0 6px;color:var(--candle);font-style:italic}
.cap h2{margin:0 0 14px;font-weight:400;font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.05}
.m-text{margin:0;color:#d9cfe2;font-size:1.1rem;line-height:1.6;max-width:30em}
.m-nav{margin-top:auto;padding-top:26px;display:flex;gap:10px;flex-wrap:wrap}
.m-nav button{font:inherit;font-size:1rem;color:var(--bone);background:#2f1f46;border:1px solid #4a3566;border-radius:999px;padding:8px 16px;cursor:pointer}
.m-nav button:hover:not(:disabled){background:#3d2959}
.m-nav button:disabled{opacity:.35;cursor:default}
.m-nav button:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
.m-nav .close{margin-left:auto}
@media (max-width:720px){
  .sheet{grid-template-columns:1fr}
  .art{border-radius:17px 17px 0 0}
  .cap{padding:22px 22px 20px}
}
.toast{position:fixed;left:50%;bottom:max(24px, env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:60;pointer-events:none;
  background:#2a1a40;border:1px solid #4a3566;color:var(--bone);padding:10px 18px;border-radius:999px;font-style:italic;transition:opacity .3s, transform .3s;
  max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  .tw,.batfly,.bob,.flap,.cloud,.ghostf,.fogd,.flk,.blk,.kind-tomb.opening,.door.nope{animation:none !important}
  .leaf,.slab,.pcover{transition-duration:.3s !important;transition-delay:0s !important}
  .door.burst::before{animation:none}
}
</style>
</head>
<body>
<header>
  <h1 id="title">Hollow Hill</h1>
  <p class="sub" id="sub"></p>
  <p class="status" id="status" aria-live="polite"></p>
</header>
<main class="stage">
  <div class="scroller"><div class="scene" id="scene"></div></div>
  <p class="hint">Click an open window, grave or pumpkin to see it up close.<span class="swipe"> Swipe sideways to see the whole hill.</span></p>
</main>

<div class="modal" id="modal" hidden>
  <div class="backdrop" data-close></div>
  <figure class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="art" id="m-art"></div>
    <figcaption class="cap">
      <p class="m-date" id="m-date"></p>
      <h2 id="m-title"></h2>
      <p class="m-text" id="m-text"></p>
      <div class="m-nav">
        <button type="button" id="m-prev">‹ Previous day</button>
        <button type="button" id="m-next">Next day ›</button>
        <button type="button" class="close" id="m-close">Close</button>
      </div>
    </figcaption>
  </figure>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Settings you may want to change ===== */
const TITLE = 'Hollow Hill';
const SUBTITLE = 'A Halloween calendar. One window opens each day from 5 to 29 October.';
/* Testing shortcut: press and hold the title for 2 seconds to preview the last day with every window
   cascading open. Anyone who finds it can peek at every day, so set this to false before sharing. */
const TEST_GESTURE = false;
/* The calendar runs 5–29 October of the current year. Preview any day with ?date=2026-10-14
   (add &last=9 to pretend you last visited on the 9th and watch the cascade). */

/* ===== Illustrations: one function per day, 5..29 October ===== */
const INK = '#0c0712';
const BAT = 'M0 -6 L-4 -14 L-6 -4 C-14 -8 -26 -16 -50 -10 C-42 -4 -40 4 -42 10 C-34 4 -26 6 -22 14 C-16 8 -10 8 -6 12 L0 16 L6 12 C10 8 16 8 22 14 C26 6 34 4 42 10 C40 4 42 -4 50 -10 C26 -16 14 -8 6 -4 L4 -14 Z';
const GHOST = 'M-54 154 C-54 52 -32 0 0 0 C32 0 54 52 54 154 L42 140 L30 156 L16 140 L0 158 L-16 140 L-30 156 L-42 140 Z';

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function frame(u, top, bottom, inner, defs){
  return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false"><defs><linearGradient id="${u}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bottom}"/></linearGradient><filter id="${u}b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter><filter id="${u}c" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>${defs||''}</defs><rect width="400" height="400" fill="url(#${u}s)"/>${inner}</svg>`;
}
function moon(u,cx,cy,r,c){ c=c||'#fbf0d0'; return `<circle cx="${cx}" cy="${cy}" r="${r*1.5}" fill="${c}" opacity=".22" filter="url(#${u}b)"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}"/><circle cx="${cx-r*.32}" cy="${cy-r*.18}" r="${r*.17}" fill="#000" opacity=".06"/><circle cx="${cx+r*.28}" cy="${cy+r*.3}" r="${r*.24}" fill="#000" opacity=".05"/><circle cx="${cx+r*.12}" cy="${cy-r*.42}" r="${r*.1}" fill="#000" opacity=".05"/>`; }
function stars(seed,n,maxY,c){ const r=rng(seed); let s=''; for(let i=0;i<n;i++){ s+=`<circle cx="${(r()*400).toFixed(1)}" cy="${(r()*maxY).toFixed(1)}" r="${(0.6+r()*1.3).toFixed(2)}" fill="${c||'#fff'}" opacity="${(0.35+r()*0.6).toFixed(2)}"/>`; } return s; }
function bat(x,y,s,rot,fill){ return `<path transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" fill="${fill||INK}" d="${BAT}"/>`; }
function crow(x,y,s,flip){ return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})" fill="${INK}"><ellipse cx="0" cy="0" rx="13" ry="7" transform="rotate(-18)"/><circle cx="-11" cy="-7" r="5.5"/><path d="M-15 -8 L-24 -5 L-15 -4 Z"/><path d="M10 2 L25 9 L23 2 L12 -3 Z"/><path d="M-2 6 L-3 13 M3 5 L4 13" stroke="${INK}" stroke-width="1.8"/></g>`; }
function flyer(x,y,s){ return `<path transform="translate(${x} ${y}) scale(${s})" d="M-14 0 Q-7 -8 0 0 Q7 -8 14 0" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`; }

const ILLOS = [
/* 5 Oct  The cat on the wall */
u => frame(u,'#2a1240','#f08a3c', `
 ${stars(5,26,160)}
 ${moon(u,252,160,100,'#ffe9b8')}
 <g fill="${INK}">
  <path d="M144 304 L154 304 L158 268 C190 262 236 262 262 268 L266 304 L278 304 L280 244 C278 200 238 186 206 192 C176 198 156 214 148 236 Z"/>
  <circle cx="140" cy="236" r="22"/>
  <path d="M122 226 L117 194 L138 214 Z M146 214 L161 192 L161 226 Z"/>
  <rect x="0" y="302" width="400" height="98"/>
 </g>
 <path d="M276 250 C308 246 322 214 302 182" stroke="${INK}" stroke-width="10" fill="none" stroke-linecap="round"/>
 <path d="M0 332 H400 M0 364 H400 M60 302 V332 M150 332 V364 M240 302 V332 M330 332 V364 M100 364 V400 M210 364 V400 M300 302 V332 M360 364 V400" stroke="#3a2140" stroke-width="2"/>
 <ellipse class="blk" cx="132" cy="234" rx="4" ry="5.5" fill="#f7d34a"/><ellipse class="blk" cx="148" cy="234" rx="4" ry="5.5" fill="#f7d34a"/>
 ${bat(70,90,.45,-10)}`),

/* 6  Night flight */
u => frame(u,'#120a2a','#7a4fc4', `
 ${stars(6,40,260)}
 ${moon(u,200,186,120,'#f3ecff')}
 ${bat(150,150,1.1,-8)}${bat(252,212,1.5,6)}${bat(302,118,.8,10)}${bat(108,252,.7,-14)}${bat(222,104,.6,0)}${bat(334,262,.55,12)}${bat(66,118,.5,-5)}
 <path d="M0 342 Q90 312 180 336 T400 320 L400 400 L0 400 Z" fill="${INK}"/>
 <path d="M292 334 V282 H320 V334 Z M289 286 L306 232 L323 286 Z M305 232 V214" fill="${INK}" stroke="${INK}" stroke-width="2"/>
 <rect x="302" y="292" width="8" height="12" rx="4" fill="#f6c768"/>`),

/* 7  The broom rider */
u => frame(u,'#1c0d05','#e9a23b', `
 ${moon(u,210,180,118,'#fff2c9')}
 <path d="M110 238 L312 196" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
 <g fill="${INK}">
  <path d="M120 236 L72 220 L62 234 L66 250 L74 258 L124 244 Z"/>
  <path d="M212 168 C200 172 180 182 148 208 C170 206 186 212 200 216 L224 212 C228 196 226 180 212 168 Z"/>
  <circle cx="222" cy="160" r="11"/>
  <path d="M198 154 L246 148 L246 153 L200 159 Z"/>
  <path d="M206 153 L234 150 L214 116 L190 104 L204 122 Z"/>
  <path d="M232 160 L243 167 L231 167 Z"/>
 </g>
 <path d="M214 182 L248 200" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
 <path d="M212 210 L240 216 L234 242" stroke="${INK}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M70 226 L40 222 M66 240 L34 242 M70 252 L42 264" stroke="${INK}" stroke-width="2.5"/>
 ${bat(80,90,.6,-10)}${bat(332,296,.5,8)}${bat(120,318,.4,0)}
 <path d="M0 362 Q60 342 120 352 L134 330 L148 352 Q260 340 400 358 L400 400 L0 400 Z" fill="${INK}"/>`),

/* 8  Something in the hallway */
u => frame(u,'#04060c','#1a2636', `
 <path d="M0 0 L170 140 L170 250 L0 400 Z" fill="#0b1119"/>
 <path d="M400 0 L230 140 L230 250 L400 400 Z" fill="#0b1119"/>
 <path d="M0 400 L170 250 L230 250 L400 400 Z" fill="#06090e"/>
 <path d="M0 0 L170 140 L230 140 L400 0 Z" fill="#0e1520"/>

  [[118,858,-20],[214,872,30],[300,858,-30],[420,880,10],[520,900,-10],[80,962,20],[250,966,-20],[480,972,30]].forEach(([x,y,a])=>{ o+=`<ellipse cx="${x}" cy="${y}" rx="18" ry="9" fill="#18240f" transform="rotate(${a} ${x} ${y})"/>`; });
  [[290,850,20],[560,950,16],[120,990,18]].forEach(([x,y,s])=>{ o+=`<ellipse cx="${x}" cy="${y}" rx="${s}" ry="${s*.72}" fill="#7a3410"/><ellipse cx="${x}" cy="${y}" rx="${s*.45}" ry="${s*.72}" fill="#8a3c12"/><path d="M${x} ${y-s*.7} L${x+2} ${y-s*1.1}" stroke="#2f3a18" stroke-width="3"/>`; });
  o+=`<g fill="${H}"><rect x="258" y="600" width="9" height="244"/><rect x="186" y="640" width="152" height="8"/>
  <path d="M236 638 L290 638 L300 736 L288 728 L278 742 L266 730 L256 744 L246 730 L236 740 L228 730 Z"/>
  <path d="M238 638 L190 642 L184 662 L192 656 L198 668 L204 656 L240 664 Z M288 638 L336 642 L342 662 L334 656 L328 668 L322 656 L286 664 Z"/>
  <circle cx="263" cy="618" r="20"/><path d="M226 606 C246 598 282 598 302 602 L300 609 C282 604 246 605 228 612 Z M246 602 L250 572 C258 566 272 568 276 574 L282 601 Z"/></g>
  <path d="M186 650 L176 646 M186 654 L174 658 M338 650 L348 646 M338 654 L350 658" stroke="${H}" stroke-width="2.5"/>
  <path d="M251 614 L259 614 L255 622 Z M267 614 L275 614 L271 622 Z" fill="#ff9a2a" opacity="${(.2+.8*p).toFixed(2)}"/>`;
  const crows=[[318,626,false],[206,628,true],[300,627,false],[226,626,true]], nc=1+Math.round(p*3);
  crows.slice(0,nc).forEach(([x,y,f])=>{ o+=crow(x,y,1.25,f); });
  // ghosts gather in the graveyard as the month goes on
  const ng = p<.15 ? 0 : Math.min(5, 1+Math.floor((p-.15)*6)), gp=[[1236,628,.32],[1468,600,.38],[1352,700,.26],[1178,560,.3],[1540,690,.28]];
  for(let i=0;i<ng;i++){ const [x,y,s]=gp[i]; o+=`<g class="ghostf" style="animation-delay:-${(i*1.7).toFixed(1)}s"><g transform="translate(${x} ${y}) scale(${s})"><path d="${GHOST}" fill="#e6eef5" opacity=".55"/><ellipse cx="-14" cy="48" rx="7" ry="11" fill="#1a1426" opacity=".7"/><ellipse cx="14" cy="48" rx="7" ry="11" fill="#1a1426" opacity=".7"/></g></g>`; }
  o+=`<g class="fogd" opacity="${(.1+.3*p).toFixed(2)}"><ellipse cx="320" cy="980" rx="440" ry="60" fill="#c9bfe0" filter="url(#fb)"/><ellipse cx="1010" cy="960" rx="460" ry="50" fill="#c9bfe0" filter="url(#fb)"/><ellipse cx="1480" cy="990" rx="380" ry="60" fill="#c9bfe0" filter="url(#fb)"/></g>`;
  return o+'</svg>';
}
/* a thin layer of fog drawn in front of the doors */
function buildFrontFog(p){
  let lanterns='';
  [[726,736],[874,736]].forEach(([x,y])=>{ lanterns+=`<circle class="flk" cx="${x}" cy="${y}" r="30" fill="#ff8a2a" opacity=".35" filter="url(#fl)"/><ellipse cx="${x}" cy="${y}" rx="15" ry="12" fill="#d9681e"/><path d="M${x-8} ${y-2} L${x-3} ${y-2} L${x-5.5} ${y-7} Z M${x+3} ${y-2} L${x+8} ${y-2} L${x+5.5} ${y-7} Z M${x-8} ${y+3} Q${x} ${y+10} ${x+8} ${y+3} Z" fill="#ffd36b"/><path d="M${x} ${y-12} L${x+2} ${y-17}" stroke="#3f4a1e" stroke-width="3"/>`; });
  return `<svg class="front" viewBox="0 0 1600 1000" aria-hidden="true" focusable="false"><defs><filter id="ff" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter><filter id="fl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter></defs>${lanterns}
  <g class="fogd" style="animation-duration:58s;animation-delay:-20s" opacity="${(.04+.26*p).toFixed(2)}"><ellipse cx="560" cy="1000" rx="520" ry="46" fill="#d6cdea" filter="url(#ff)"/><ellipse cx="1300" cy="1010" rx="420" ry="44" fill="#d6cdea" filter="url(#ff)"/></g></svg>`;
}

/* ===== Dates ===== */
const qs = new URLSearchParams(location.search);
let now = new Date(), preview = false;
const qd = qs.get('date');
if (qd && /^\d{4}-\d{2}-\d{2}$/.test(qd)) { const [y,m,d] = qd.split('-').map(Number); now = new Date(y, m-1, d); preview = true; }
const Y = now.getFullYear();
const today0 = new Date(Y, now.getMonth(), now.getDate());
const start = new Date(Y, MONTH, FIRST), end = new Date(Y, MONTH, LAST);
let phase, current;
if (today0 < start) { phase = 'before'; current = FIRST - 1; }
else if (today0 > end) { phase = 'after'; current = LAST; }
else { phase = 'during'; current = today0.getDate(); }
const progress = phase === 'before' ? 0 : (current - FIRST) / (TOTAL - 1);
const fmt = date => date.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
const fmtDay = d => fmt(new Date(Y, MONTH, d));

/* what this browser has seen before, so missed days can open in a cascade */
const KEY = 'hollow-hill-seen-' + Y;
function readSeen(){ try { const v = localStorage.getItem(KEY); return v ? parseInt(v, 10) : null; } catch(e) { return null; } }
function writeSeen(v){ try { localStorage.setItem(KEY, String(v)); } catch(e) {} }
let lastSeen = preview ? (qs.has('last') ? parseInt(qs.get('last'), 10) : null) : readSeen();
if (lastSeen !== null && isNaN(lastSeen)) lastSeen = null;

let cascade = [];
if (phase === 'during') {
  if (lastSeen !== null) { for (let d = Math.max(lastSeen + 1, FIRST); d < current; d++) cascade.push(d); }
  else if (now.getDay() === 1) { for (let d = current - 2; d < current; d++) if (d >= FIRST) cascade.push(d); }
  cascade.push(current);
} else if (phase === 'after' && lastSeen !== null && lastSeen < LAST) {
  for (let d = Math.max(lastSeen + 1, FIRST); d <= LAST; d++) cascade.push(d);
}
const autoShow = phase === 'during' && (preview || lastSeen === null || lastSeen < current);
if (!preview && phase !== 'before') writeSeen(current);

/* ===== Build the page ===== */
document.getElementById('title').textContent = TITLE;
document.getElementById('sub').textContent = SUBTITLE;
const status = document.getElementById('status');
if (phase === 'before') {
  const left = Math.round((start - today0) / 864e5);
  status.textContent = `The first window opens on ${fmtDay(FIRST)}, ${left === 1 ? 'tomorrow' : `in ${left} days`}.`;
} else if (phase === 'during') {
  status.textContent = current === LAST ? `${fmt(today0)}. The last window opens today. See you at the party.`
    : `${fmt(today0)}. ${current - FIRST + 1} of ${TOTAL} windows are open.`;
} else status.textContent = `All ${TOTAL} windows are open. Happy Halloween.`;
if (preview) {
  status.textContent += ' This is a preview. ';
  const back = document.createElement('a'), u = new URL(location.href);
  u.searchParams.delete('date'); u.searchParams.delete('last');
  back.href = u.href; back.textContent = 'Back to today';
  status.appendChild(back);
}

/* hold the title for 2 seconds: preview the 29th with every window cascading open */
if (TEST_GESTURE) {
  const t = document.getElementById('title'); let hold = null;
  const stop = () => { clearTimeout(hold); hold = null; t.classList.remove('holding'); };
  t.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    t.classList.add('holding');
    hold = setTimeout(() => {
      const u = new URL(location.href);
      u.searchParams.set('date', `${Y}-10-${LAST}`); u.searchParams.set('last', String(FIRST - 1));
      location.href = u.href;
    }, 2000);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => t.addEventListener(ev, stop));
  t.addEventListener('contextmenu', e => e.preventDefault());
}

const scene = document.getElementById('scene');
scene.insertAdjacentHTML('beforeend', buildScene(progress));
const doors = {};
const isDue = d => phase !== 'before' && d <= current;
for (let d = FIRST; d <= LAST; d++) {
  const q = POS[LAYOUT[d]], b = document.createElement('button');
  b.type = 'button';
  b.className = `door kind-${q.k} shape-${q.s || 'oval'}${q.k === 'pumpkin' && d % 2 ? ' roll-left' : ''}${isDue(d) ? '' : ' locked'}`;
  b.style.cssText = `left:${q.x/16}%;top:${q.y/10}%;width:${q.w/16}%;height:${q.h/10}%`;
  const cover = q.k === 'tomb' ? '<span class="slab"></span>' : q.k === 'pumpkin' ? `<span class="pcover">${PUMPKIN}</span>` : '<span class="leaf l"></span><span class="leaf r"></span>';
  b.innerHTML = `<span class="inside"></span>${cover}<span class="num" aria-hidden="true">${d}</span>`;
  b.setAttribute('aria-label', isDue(d) ? `${fmtDay(d)}: ${DATA[d-FIRST].t}` : `${fmtDay(d)}: not open yet`);
  b.addEventListener('click', () => onDoor(d));
  scene.appendChild(b); doors[d] = b;
}
scene.insertAdjacentHTML('beforeend', buildFrontFog(progress));

function openDoor(d, animate){
  const b = doors[d];
  if (b.classList.contains('open')) return;
  b.querySelector('.inside').innerHTML = ILLOS[d-FIRST]('t' + d);
  if (!animate) { b.classList.add('instant', 'open'); return; }
  b.classList.add('opening', 'burst');
  requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('open')));
  setTimeout(() => b.classList.remove('opening', 'burst'), 2200);
}
for (let d = FIRST; d <= LAST; d++) if (isDue(d) && !cascade.includes(d)) openDoor(d, false);

/* on narrow screens, scroll so today's door is in view */
const scroller = document.querySelector('.scroller');
if (phase === 'during' && scroller.scrollWidth > scroller.clientWidth) { const b = doors[current]; scroller.scrollLeft = b.offsetLeft + b.offsetWidth / 2 - scroller.clientWidth / 2; }

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
requestAnimationFrame(() => document.body.classList.add('loaded'));
const gap = reduce ? 150 : cascade.length > 4 ? Math.max(200, 2600 / cascade.length) : 750;
setTimeout(() => {
  cascade.forEach((d, i) => setTimeout(() => openDoor(d, true), i * gap));
  if (autoShow) setTimeout(() => { if (modal.hidden) showModal(current); }, (cascade.length - 1) * gap + (reduce ? 600 : 2100));
}, reduce ? 200 : 1100);

/* ===== Close-up view ===== */
const modal = document.getElementById('modal'), toastEl = document.getElementById('toast');
const M = id => document.getElementById(id);
let modalDay = null, lastFocus = null, mc = 0, toastTimer;
function onDoor(d){
  if (isDue(d)) { openDoor(d, !doors[d].classList.contains('open')); showModal(d); return; }
  const b = doors[d]; b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope');
  toast(phase === 'before' ? `The calendar starts on ${fmtDay(FIRST)}.` : `This one opens on ${fmtDay(d)}.`);
}
function showModal(d){
  modalDay = d; const i = d - FIRST;
  M('m-art').innerHTML = ILLOS[i]('m' + (mc++) + '_');
  M('m-date').textContent = fmtDay(d);
  M('m-title').textContent = DATA[i].t;
  M('m-text').textContent = DATA[i].c;
  M('m-prev').disabled = d <= FIRST;
  M('m-next').disabled = d >= current;
  if (modal.hidden) { lastFocus = document.activeElement; modal.hidden = false; requestAnimationFrame(() => modal.classList.add('show')); M('m-close').focus(); }
}
function step(dir){ const d = modalDay + dir; if (d < FIRST || d > current) return; openDoor(d, false); showModal(d); }
function closeModal(){
  modal.classList.remove('show'); setTimeout(() => { modal.hidden = true; }, 300);
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
M('m-prev').onclick = () => step(-1);
M('m-next').onclick = () => step(1);
M('m-close').onclick = closeModal;
modal.querySelector('[data-close]').onclick = closeModal;
document.addEventListener('keydown', e => {
  if (modal.hidden) return;
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'Tab') {
    const f = [...modal.querySelectorAll('button:not(:disabled)')], first = f[0], last = f[f.length-1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600); }

/* if the page is left open overnight, reload when the date changes */
if (!preview) { const day = now.getDate(); setInterval(() => { if (new Date().getDate() !== day) location.reload(); }, 60000); }
</script>
</body>
</html>
